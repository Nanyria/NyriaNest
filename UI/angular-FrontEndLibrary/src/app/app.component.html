<!--app.component.html-->

@if (isAuthenticated()) {
  <div class="nn-theme nn-parchment nn-shell">
    <app-topbar class="nn-shell__topbar"></app-topbar>
    <main class="nn-shell__main">
      <router-outlet></router-outlet>
    </main>
    <app-bottom-nav class="nn-shell__bottom-nav"></app-bottom-nav>
    <app-toast></app-toast>
    <app-confirm-dialog></app-confirm-dialog>
  </div>
} @else {
  <main class="app-body">
    <router-outlet></router-outlet>
  </main>
}
