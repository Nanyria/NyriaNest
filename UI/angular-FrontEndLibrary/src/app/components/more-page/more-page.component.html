<section class="more">
  <header class="more__header">
    <i class="bi bi-three-dots more__icon" aria-hidden="true"></i>
    <div>
      <h1 class="more__title">More</h1>
      <p class="more__subtitle">Settings, tools and more.</p>
    </div>
  </header>

  <ng-template #row let-item>
    @if (item.route) {
      <a class="more__row" [routerLink]="item.route">
        <i class="bi {{ item.icon }} more__row-icon"></i>
        <span class="more__row-label">{{ item.label }}</span>
        <i class="bi bi-chevron-right more__chevron"></i>
      </a>
    } @else {
      <span class="more__row is-placeholder" aria-disabled="true" title="Coming soon">
        <i class="bi {{ item.icon }} more__row-icon"></i>
        <span class="more__row-label">{{ item.label }}</span>
        <span class="more__soon">Soon</span>
      </span>
    }
  </ng-template>

  <ul class="more__list">
    @for (item of links; track item.label) {
      <li><ng-container *ngTemplateOutlet="row; context: { $implicit: item }"></ng-container></li>
    }

    <!-- One row for all admin pages; it opens their links below it -->
    @if (isAdmin) {
      <li>
        <button
          type="button"
          class="more__row"
          [attr.aria-expanded]="adminOpen"
          aria-controls="more-admin"
          (click)="adminOpen = !adminOpen"
        >
          <i class="bi {{ adminGroup.icon }} more__row-icon"></i>
          <span class="more__row-label">{{ adminGroup.label }}</span>
          <i class="bi bi-chevron-down more__chevron" [class.is-open]="adminOpen"></i>
        </button>
        @if (adminOpen) {
          <ul id="more-admin" class="more__list more__list--sub">
            @for (item of adminGroup.items; track item.label) {
              <li><ng-container *ngTemplateOutlet="row; context: { $implicit: item }"></ng-container></li>
            }
          </ul>
        }
      </li>
    }

    <li><ng-container *ngTemplateOutlet="row; context: { $implicit: settings }"></ng-container></li>

    <li>
      <button type="button" class="more__row" (click)="logout()">
        <i class="bi bi-box-arrow-right more__row-icon"></i>
        <span class="more__row-label">Log out</span>
      </button>
    </li>
  </ul>
</section>
