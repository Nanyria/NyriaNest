<!-- Esc fires "close"; ConfirmService.close() ignores it if the answer is already in.
     The theme's card frame (nn-panel--framed); with no title along the top,
     it has a star on both the top and bottom line. -->
<dialog
  #dialog
  class="confirm nn-panel--framed"
  aria-labelledby="confirm-title"
  aria-describedby="confirm-message"
  (close)="confirm.close(false)"
  (click)="onClick($event)"
>
  @if (confirm.current(); as c) {
    <div class="confirm__body">
      <!-- Diamond like the logo; red for things that can't be undone -->
      <span class="confirm__seal" [class.is-danger]="c.danger" aria-hidden="true">
        <i class="bi" [class]="'bi-' + (c.icon ?? (c.danger ? 'exclamation-lg' : 'question-lg'))"></i>
      </span>
      <h2 id="confirm-title" class="confirm__title">{{ c.title }}</h2>
      <div class="nn-divider confirm__divider" aria-hidden="true"><span class="nn-divider__mark"></span></div>
      @if (c.message) {
        <p id="confirm-message" class="confirm__message">{{ c.message }}</p>
      }
      <!-- Cancel gets focus, so pressing Enter by habit doesn't confirm -->
      <div class="confirm__actions">
        <button type="button" class="nn-btn nn-btn--outline" autofocus (click)="confirm.close(false)">
          {{ c.cancelLabel ?? 'Cancel' }}
        </button>
        <button
          type="button"
          class="nn-btn nn-btn--ornate"
          [class.nn-btn--danger]="c.danger"
          [class.nn-btn--primary]="!c.danger"
          (click)="confirm.close(true)"
        >
          {{ c.confirmLabel }}
        </button>
      </div>
    </div>
  }
</dialog>
